openapi: 3.0.3
info:
  title: My API
  version: 1.0.0
  description: API documentation for my project
paths:
  /api/Batch/:
    get:
      operationId: Batch_list
      description: Get all batches.
      summary: List all batches
      tags:
      - Batch
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Batch'
          description: ''
    post:
      operationId: Batch_create
      description: Teacher creates a batch.
      summary: Create batch
      tags:
      - Batch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BatchCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BatchCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
          description: ''
  /api/Batch/{id}/:
    get:
      operationId: Batch_retrieve
      description: Retrieve a single batch using batch ID.
      summary: Get batch by ID
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this batch.
        required: true
      tags:
      - Batch
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
          description: ''
    put:
      operationId: Batch_update
      summary: Update batch
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this batch.
        required: true
      tags:
      - Batch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BatchCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BatchCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
          description: ''
    patch:
      operationId: Batch_partial_update
      summary: Partially update batch
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this batch.
        required: true
      tags:
      - Batch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBatchCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBatchCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBatchCreateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
          description: ''
    delete:
      operationId: Batch_destroy
      summary: Delete batch
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this batch.
        required: true
      tags:
      - Batch
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
